name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel superseded tag runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate (fmt / clippy / audit / deny / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny check
        run: cargo deny check

  release:
    name: release (${{ matrix.target }})
    needs: gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary: gpt55-chat
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            binary: gpt55-chat
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary: gpt55-chat
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary: gpt55-chat
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary: gpt55-chat.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilers (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo "[target.aarch64-unknown-linux-gnu]"
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="gpt55-chat-${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$NAME/"
          cp README.md LICENSE LICENSE-MIT SECURITY.md "$NAME/"
          tar -czf "$NAME.${{ matrix.archive_ext }}" "$NAME"
          shasum -a 256 "$NAME.${{ matrix.archive_ext }}" > "$NAME.sha256"

      - name: Stage artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "gpt55-chat-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $name
          Copy-Item README.md,LICENSE,LICENSE-MIT,SECURITY.md $name
          Compress-Archive -Path $name -DestinationPath "$name.${{ matrix.archive_ext }}"
          Get-FileHash "$name.${{ matrix.archive_ext }}" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name.${{ matrix.archive_ext }}" } > "$name.sha256"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gpt55-chat-${{ matrix.target }}.cdx.json
          output-file: gpt55-chat-${{ matrix.target }}.cdx.json

      - name: Attest artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            gpt55-chat-*.${{ matrix.archive_ext }}
            gpt55-chat-${{ matrix.target }}.cdx.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            gpt55-chat-*.${{ matrix.archive_ext }}
            gpt55-chat-*.sha256
            gpt55-chat-${{ matrix.target }}.cdx.json
