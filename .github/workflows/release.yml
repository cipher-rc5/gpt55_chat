name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.100

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets

  release:
    name: release (${{ matrix.target }})
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary: gpt55-chat
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary: gpt55-chat
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary: gpt55-chat.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.100
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="gpt55-chat-${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$NAME/"
          cp README.md LICENSE LICENSE-MIT "$NAME/"
          tar -czf "$NAME.${{ matrix.archive_ext }}" "$NAME"
          shasum -a 256 "$NAME.${{ matrix.archive_ext }}" > "$NAME.sha256"

      - name: Stage artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "gpt55-chat-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $name
          Copy-Item README.md,LICENSE,LICENSE-MIT $name
          Compress-Archive -Path $name -DestinationPath "$name.${{ matrix.archive_ext }}"
          Get-FileHash "$name.${{ matrix.archive_ext }}" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name.${{ matrix.archive_ext }}" } > "$name.sha256"

      - name: Attest artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: gpt55-chat-*.${{ matrix.archive_ext }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            gpt55-chat-*.${{ matrix.archive_ext }}
            gpt55-chat-*.sha256
