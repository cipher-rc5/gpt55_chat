name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so betterleaks can scan every commit, not just the tip.
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: docker://ghcr.io/betterleaks/betterleaks:latest
        with:
          # Scans the checked-out git history; honors .betterleaks.toml.
          # Exits non-zero (failing the job) if any secret is found.
          args: git /github/workspace --no-banner --redact --report-format sarif --report-path results.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: betterleaks-sarif
          path: results.sarif
          if-no-files-found: ignore
