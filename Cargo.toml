[package]
name = "gpt55-chat"
version = "0.1.0"
edition = "2024"
keywords = ["openai", "azure", "responses-api", "chat", "cli"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cipher-rc5/gpt55_chat"
rust-version = "1.93"
description = "Multi-turn chat CLI for the OpenAI/Azure Responses API with system prompt, rules, and function tools"

[[bin]]
name = "gpt55-chat"
path = "src/main.rs"

[lib]
name = "gpt55_chat"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
dotenvy = "=0.15.7"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt", "macros", "time"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
